! --- Fonts ---
xterm*faceName: xos4 Terminus:style=Regular
xterm*faceSize: 16
xterm*renderFont: true
xterm*fontAntialiasing: false

! --- VT font menu (Pixel-perfect sizing overrides) ---
xterm*faceSize1: 8
xterm*faceSize2: 10
xterm*faceSize3: 12
xterm*faceSize4: 14
xterm*faceSize5: 16
xterm*faceSize6: 20
 
! --- Behaviour ---
xterm*highlightSelection: true
xterm*selectToClipboard: true

! --- Keybindings ---
xterm*vt100.translations: #override \n\
	Ctrl <Key>-: smaller-vt-font() \n\
	Ctrl <Key>+: larger-vt-font() \n\
	Ctrl <Key>0: set-vt-font(d) \n\
	
! --- Colors (Dracula Theme) ---
*background:  #282a36
*foreground:  #f8f8f2
*cursorColor: #f8f8f2

! Black (Background / Current Line)
*color0:      #21222c
*color8:      #6272a4

! Red
*color1:      #ff5555
*color9:      #ff6e6e

! Green
*color2:      #50fa7b
*color10:     #69ff94

! Yellow
*color3:      #f1fa8c
*color11:     #ffffa5

! Blue (Comment / Purple mix for terminal balance)
*color4:      #bd93f9
*color12:     #d6acff

! Magenta (Pink)
*color5:      #ff79c6
*color13:     #ff92df

! Cyan
*color6:      #8be9fd
*color14:     #a4ffff

! White
*color7:      #f8f8f2
*color15:     #ffffff



