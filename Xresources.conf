! --- Fonts ---
xterm*faceName: Unifont:size=16

! --- VT font menu ---
xterm*faceSize1: 8
xterm*faceSize2: 10
xterm*faceSize3: 12
xterm*faceSize4: 18
xterm*faceSize5: 22
xterm*faceSize6: 24
 
! --- Behaviour ---
xterm*highlightSelection: true
xterm*selectToClipboard: true

! --- Colors ---
*background: #1e1e1e
*foreground: #cccccc
*cursorColor: #cccccc

! Black
color0:   #333333
color8:   #555555
! Red     
color1:   #f07178
color9:   #ff8b92
! Green
color2:   #c2d94c
color10:  #d6e87c
! Yellow
color3:   #ffcc66
color11:  #ffe4a8
! Blue
color4:   #739df2
color12:  #9dbfff
! Magenta
color5:   #ae81ff
color13:  #c5a3ff
! Cyan
color6:   #5ccfe6
color14:  #87e3f5
! White
color7:   #e0e0e0
color15:  #ffffff

! --- Keybindings ---
xterm*vt100.translations: #override \n\
	Ctrl <Key>-: smaller-vt-font() \n\
	Ctrl <Key>+: larger-vt-font() \n\
	Ctrl <Key>0: set-vt-font(d) \n\
	
	

