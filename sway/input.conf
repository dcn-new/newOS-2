# Keyboard configuration
input * {
	xkb_layout gb
}

input "type:keyboard" {
	repeat_rate 35
	repeat_delay 200
}

# Touchpad configuration
input "type:touchpad" {
	tap enabled
	tap_button_map lrm
	dwt enabled
	natural_scroll enabled
	scroll_method two_finger
}

# Focus following options
focus_follows_mouse no
	
