#################################
#       General Settings        #
#################################

# "xrender" is the safe default and works everywhere (incl. VMs / software
# rendering). On NVIDIA proprietary drivers it can cause mouse/render lag and
# broken vsync — if you see that, switch to "glx".
backend = "xrender";
dithered-present = false;
#vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
#   Transparency / Opacity      #
#################################

frame-opacity = 1.0;

#################################
#    FAST SNAPPY ANIMATIONS     #
#################################

animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.20;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.20;
  },
  {
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.30;
  }
);

