# --- Variables ---
# Logo key
set $mod Mod4

# Environmental variables
set $TERMINAL st
set $TERMINAL2 alacritty
set $LAUNCHER dmenu_run
set $BROWSER firefox
set $EDITOR $TERMINAL2 -e vim

# Home row direction keys (vim style)
set $left left
set $down down
set $up up
set $right right

# --- Core system and application launch ---
# Spawn a terminal
bindsym $mod+Return exec $TERMINAL

# Launch an editor (for note-taking)
bindsym $mod+e exec $EDITOR

# Launch browser
bindsym $mod+q exec $BROWSER

# Kill focused window
bindsym $mod+BackSpace kill

# Start application launcher
bindsym $mod+d exec $LAUNCHER

# Reload sway
bindsym $mod+Shift+c reload

# Exit sway session (clean exit)
bindsym $mod+Control+Shift+e exec i3msg exit

# --- Window layout and navigation ---
# Focus window
bindsym $mod+$left focus left 
bindsym $mod+$down focus down
bindsym $mod+$up focus up 
bindsym $mod+$right focus right 

# Move window
bindsym $mod+Shift+$left move left 
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up 
bindsym $mod+Shift+$right move right

# Fullscreen toggle
bindsym $mod+f fullscreen toggle

# Toggle floating window
bindsym $mod+Shift+space floating toggle

# swap between floating and tiling mode
bindsym $mod+space focus mode_toggle

# Floating modifier
floating_modifier $mod normal

# Split container
bindsym $mod+b split h
bindsym $mod+v split v

# Switch layout style
bindsym $mod+comma layout stacking
bindsym $mod+period layout tabbed
bindsym $mod+slash layout toggle split

# --- Resizing containers ---
mode "resize" {
	bindsym $left resize shrink width 10 px or 8 ppt
	bindsym $down resize grow height 10 px or 8 ppt
	bindsym $up resize shrink height 10 px or 8 ppt
	bindsym $right resize grow width 10 px or 8 ppt
	# Return to default mode
	bindsym Return mode "default"
	bindsym Escape mode "default"
}

bindsym $mod+r mode "resize"

# ---- Workspaces ----
# Switch to workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# Move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# --- Audio and visual ---
# Volume controls
bindsym --no-startup-id XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_SINK@ 5%+
bindsym --no-startup-id XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_SINK@ 5%-
bindsym --no-startup-id XF86AudioMute exec wpctl set-mute @DEFAULT_SINK@ toggle
bindsym --no-startup-id XF86AudioMicMute exec wpctl set-mute @DEFAULT_SOURCE@ toggle

# Brightness control
bindsym --no-startup-id XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym --no-startup-id XF86MonBrightnessDown exec brightnessctl set 5%-

# Screenshot (fullscreen)
# Fullscreen screenshot
bindsym Print exec --no-startup-id scrot 'screenshot-%Y-%m-%d_%H-%M-%S.png' -e 'mv $f ~/Pictures/screenshots/'

# Area selection screenshot
bindsym Shift+Print exec --no-startup-id scrot -s 'screenshot-%Y-%m-%d_%H-%M-%S.png' -e 'mv $f ~/Pictures/screenshots/'(slurp)" ~/Pictures/screenshots/screenshot-$(date +%F_%H-%M-%S).png
